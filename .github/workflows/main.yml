name: CI

on: ["push", "pull_request"]

jobs:
  lint:
    name: "Lint"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        go: ["1.23.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.833
      - name: Generate templates
        run: make templ-generate
      - run: "make vet"
      - uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "latest"
          install-go: false
          cache-key: ${{ matrix.go }}

  test:
    name: "Test"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        go: ["1.23.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.833
      - name: Generate templates
        run: make templ-generate
      - run: "make test"
